name: Build

# Builds PSYstrap.exe on every push / pull request.
# Pushing a version tag (e.g. v2.12.0) also creates a draft GitHub release with the exe attached,
# which PSYstrap's auto-updater uses once ProjectRepository is set (fork\rebrand.ps1 -Repo owner/name).
# Tags must be newer than the version in Bloxstrap.csproj (2.11.4), or the updater treats them as old.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Publish single-file exe
        run: >
          dotnet publish .\Bloxstrap\Bloxstrap.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }}
          -o dist

      - name: Tidy output and add license
        shell: pwsh
        run: |
          Get-ChildItem dist -Include *.pdb, *.xml -Recurse | Remove-Item
          Copy-Item LICENSE "dist/License - Bloxstrap.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: PSYstrap (${{ github.sha }})
          path: dist/*

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PSYstrap ${{ github.ref_name }}
          files: |
            dist/PSYstrap.exe
            dist/License - Bloxstrap.txt
